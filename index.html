<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Whells — Personnalise ton fauteuil roulant</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Active JavaScript pour utiliser cette page.</noscript>
    <script>
      (function () {
        function showFallback(detail) {
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          root.innerHTML =
            '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#f5ead9;background:#1a1512;min-height:100vh;">' +
            '<h1 style="font-size:20px;">La page n\'a pas pu se charger</h1>' +
            '<p>Ton navigateur est peut-être trop ancien pour cette application. Essaie avec une version récente de Chrome ou Safari.</p>' +
            (detail ? '<p style="font-size:12px;color:#c3b29b;">' + detail + '</p>' : '') +
            '<button onclick="location.reload()" style="margin-top:16px;padding:10px 20px;border-radius:999px;border:1px solid #3c3125;background:#231c17;color:#f5ead9;">Recharger</button>' +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          showFallback(e.message);
        });
        setTimeout(function () {
          showFallback('');
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
